[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness2-demo"
version = "0.1.0"
description = "把 Google Harness² 的双层递归自我改进机制落到「AI Agent & Web3 DeFi 新闻收集提示词」场景的离线演示项目"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# 运行时零第三方依赖：只用 Python 标准库。
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
harness2-demo = "harness2_demo.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["harness2_demo*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
